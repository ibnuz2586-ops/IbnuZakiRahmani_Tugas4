<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Buku Perpustakaan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>📚 Daftar Buku Perpustakaan</h1>

        <div class="form">
            <input type="text" id="judul" placeholder="Masukkan Judul Buku">
            <input type="text" id="penulis" placeholder="Masukkan Nama Penulis">
            <button id="tambahBtn">Tambah Buku</button>
        </div>

        <div class="search">
            <input type="text" id="cariBuku" placeholder="Cari Buku...">
        </div>

        <ul id="daftarBuku"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
